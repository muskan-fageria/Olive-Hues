<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Olive Hues - Custom Themes</title>
    <link rel="stylesheet" href="style.css">

    <!-- Google Fonts Preconnect and Links -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500&family=Inter:wght@300;400;600&family=Lora:ital,wght@0,400;0,600&family=Merriweather:wght@300;400;700&family=Montserrat:wght@500;700;800&family=Nunito:wght@300;400;600&family=Playfair+Display:ital,wght@0,500;0,700&family=Poppins:wght@300;400;500&family=Quicksand:wght@300;400;500&family=Space+Mono:ital,wght@0,400;0,700&display=swap"
        rel="stylesheet">
</head>

<body style="background-color: #E4E4E7;">
    <div id="bg-layer" class="bg-layer" style="background-color: #E4E4E7; z-index: -2;"></div>
    
    <div class="container">
        <header>
            <h1 class="main-title">Custom Themes</h1>
            <p class="subtitle">Design your own aesthetic.</p>
            <div class="mood-selectors">
                <a href="index.html" class="mood-btn">Back to Home</a>
                <button id="add-new-btn" class="mood-btn active">Add New</button>
            </div>
        </header>

        <main class="mood-content">
            <div id="custom-palettes-container" class="palettes-scroll-container">
                <!-- Custom panels will be dynamically generated here -->
            </div>
        </main>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="custom.js"></script>
</body>

</html>
