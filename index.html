<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aesthetic Mood Board Generator</title>
    <link rel="stylesheet" href="style.css">
    
    <!-- Google Fonts Preconnect and Links for All 6 Moods -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500&family=Inter:wght@300;400;600&family=Lora:ital,wght@0,400;0,600&family=Merriweather:wght@300;400;700&family=Montserrat:wght@500;700;800&family=Nunito:wght@300;400;600&family=Playfair+Display:ital,wght@0,500;0,700&family=Poppins:wght@300;400;500&family=Quicksand:wght@300;400;500&family=Space+Mono:ital,wght@0,400;0,700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="container">
        <header>
            <h1 class="main-title">Mood Board Generator</h1>
            <p class="subtitle">Select a vibe to transform your space.</p>
            <div class="mood-selectors" id="mood-selectors">
                <!-- Mood Buttons will be dynamically generated here -->
            </div>
        </header>

        <main class="mood-content">
            <div class="mood-header glass-panel">
                <div class="card-content">
                    <h2 id="mood-title">Select a mood</h2>
                    <p id="mood-quote" class="quote">"Your vibe attracts your tribe."</p>

                    <div class="info-container" style="align-items: center;">
                        <div class="info-section">
                            <h3 style="text-align: center;">Font Pairing</h3>
                            <div class="fonts-display">
                                <div class="font-box">
                                    <span class="font-label">Heading</span>
                                    <span id="heading-font" class="font-name">Inter</span>
                                </div>
                                <div class="font-box">
                                    <span class="font-label">Body</span>
                                    <span id="body-font" class="font-name">Inter</span>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <div id="palettes-container" class="palettes-scroll-container">
                <!-- Color palettes panels will be dynamically generated here -->
            </div>
                </div>
            </div>
        </main>
    </div>

    <script src="script.js"></script>
</body>
</html>
