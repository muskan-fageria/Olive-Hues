<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Olive Hues</title>
    <link rel="stylesheet" href="style.css">

    <!-- Google Fonts Preconnect and Links for All 6 Moods -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500&family=Inter:wght@300;400;600&family=Lora:ital,wght@0,400;0,600&family=Merriweather:wght@300;400;700&family=Montserrat:wght@500;700;800&family=Nunito:wght@300;400;600&family=Playfair+Display:ital,wght@0,500;0,700&family=Poppins:wght@300;400;500&family=Quicksand:wght@300;400;500&family=Space+Mono:ital,wght@0,400;0,700&display=swap"
        rel="stylesheet">
</head>

<body>
    <div id="bg-layer" class="bg-layer"></div>
    <button id="basket-btn" class="basket-btn">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M6 2L3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4z"></path>
            <line x1="3" y1="6" x2="21" y2="6"></line>
            <path d="M16 10a4 4 0 0 1-8 0"></path>
        </svg>
        <span id="basket-count" class="basket-count">0</span>
    </button>
    
    <a href="custom.html" id="custom-link-btn" class="basket-btn" style="top: calc(2rem + 70px);" title="Create Custom Theme">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="12" cy="12" r="10"></circle>
            <line x1="12" y1="8" x2="12" y2="16"></line>
            <line x1="8" y1="12" x2="16" y2="12"></line>
        </svg>
    </a>

    <!-- Basket Modal -->
    <div id="basket-modal" class="basket-modal">
        <div class="basket-content glass-panel">
            <div class="basket-header">
                <h2>Saved Palettes</h2>
                <div style="display: flex; gap: 1rem; align-items: center;">
                    <a href="custom.html" class="custom-theme-btn" title="Create Custom Theme">
                        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <circle cx="12" cy="12" r="10"></circle>
                            <line x1="12" y1="8" x2="12" y2="16"></line>
                            <line x1="8" y1="12" x2="16" y2="12"></line>
                        </svg>
                    </a>
                    <button id="close-basket" class="close-btn">&times;</button>
                </div>
            </div>
            <div id="basket-items" class="basket-items">
                <!-- Saved items go here -->
            </div>
        </div>
    </div>

    <div class="container">
        <header>
            <h1 class="main-title">Olive Hues</h1>
            <p class="subtitle">Select a vibe to transform your space.</p>
            <div class="mood-selectors" id="mood-selectors">
                <!-- Mood Buttons will be dynamically generated here -->
            </div>
        </header>

        <main class="mood-content">
            <div class="mood-header glass-panel">
                <div class="card-content">
                    <h2 id="mood-title">Select a mood</h2>
                    <p id="mood-quote" class="quote">"Your vibe attracts your tribe."</p>

                    <div class="info-container" style="align-items: center;">
                        <div class="info-section">
                            <h3 style="text-align: center;">Font Pairing</h3>
                            <div class="fonts-display">
                                <div class="font-box">
                                    <span class="font-label">Heading</span>
                                    <span id="heading-font" class="font-name">Inter</span>
                                </div>
                                <div class="font-box">
                                    <span class="font-label">Body</span>
                                    <span id="body-font" class="font-name">Inter</span>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <div id="palettes-container" class="palettes-scroll-container">
                <!-- Color palettes panels will be dynamically generated here -->
            </div>
    </div>
    </div>
    </main>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="script.js"></script>
</body>

</html>
